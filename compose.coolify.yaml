services:
  configurator:
    image: frappe-custom:v16
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;
        bench set-config -g cookie_domain ".ty-dev.site";
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe_network

  backend:
    image: frappe-custom:v16
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Host: erp.ty-dev.site' http://127.0.0.1:8000/api/method/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      frappe_network:
        aliases:
          - frappe-backend

  frontend:
    image: frappe-custom:v16
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: frappe-backend:8000
      SOCKETIO: frappe-websocket:9000
      NGINX_LISTEN_PORT: "8080"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Host: erp.ty-dev.site' http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
      - websocket
    networks:
      - frappe_network
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.frappe-erp-http.rule=Host(`erp.ty-dev.site`)
      - traefik.http.routers.frappe-erp-http.entrypoints=http
      - traefik.http.routers.frappe-erp-http.service=frappe-frontend
      - traefik.http.routers.frappe-erp-https.rule=Host(`erp.ty-dev.site`)
      - traefik.http.routers.frappe-erp-https.entrypoints=https
      - traefik.http.routers.frappe-erp-https.tls=true
      - traefik.http.routers.frappe-erp-https.service=frappe-frontend
      - traefik.http.routers.frappe-crm-http.rule=Host(`crm.ty-dev.site`)
      - traefik.http.routers.frappe-crm-http.entrypoints=http
      - traefik.http.routers.frappe-crm-http.service=frappe-frontend
      - traefik.http.routers.frappe-crm-https.rule=Host(`crm.ty-dev.site`)
      - traefik.http.routers.frappe-crm-https.entrypoints=https
      - traefik.http.routers.frappe-crm-https.tls=true
      - traefik.http.routers.frappe-crm-https.service=frappe-frontend
      - traefik.http.routers.frappe-helpdesk-http.rule=Host(`helpdesk.ty-dev.site`)
      - traefik.http.routers.frappe-helpdesk-http.entrypoints=http
      - traefik.http.routers.frappe-helpdesk-http.service=frappe-frontend
      - traefik.http.routers.frappe-helpdesk-https.rule=Host(`helpdesk.ty-dev.site`)
      - traefik.http.routers.frappe-helpdesk-https.entrypoints=https
      - traefik.http.routers.frappe-helpdesk-https.tls=true
      - traefik.http.routers.frappe-helpdesk-https.service=frappe-frontend
      - traefik.http.routers.frappe-chat-http.rule=Host(`chat.ty-dev.site`)
      - traefik.http.routers.frappe-chat-http.entrypoints=http
      - traefik.http.routers.frappe-chat-http.service=frappe-frontend
      - traefik.http.routers.frappe-chat-https.rule=Host(`chat.ty-dev.site`)
      - traefik.http.routers.frappe-chat-https.entrypoints=https
      - traefik.http.routers.frappe-chat-https.tls=true
      - traefik.http.routers.frappe-chat-https.service=frappe-frontend
      - traefik.http.routers.frappe-wiki-http.rule=Host(`wiki.ty-dev.site`)
      - traefik.http.routers.frappe-wiki-http.entrypoints=http
      - traefik.http.routers.frappe-wiki-http.service=frappe-frontend
      - traefik.http.routers.frappe-wiki-https.rule=Host(`wiki.ty-dev.site`)
      - traefik.http.routers.frappe-wiki-https.entrypoints=https
      - traefik.http.routers.frappe-wiki-https.tls=true
      - traefik.http.routers.frappe-wiki-https.service=frappe-frontend
      - traefik.http.routers.frappe-insights-http.rule=Host(`insights.ty-dev.site`)
      - traefik.http.routers.frappe-insights-http.entrypoints=http
      - traefik.http.routers.frappe-insights-http.service=frappe-frontend
      - traefik.http.routers.frappe-insights-https.rule=Host(`insights.ty-dev.site`)
      - traefik.http.routers.frappe-insights-https.entrypoints=https
      - traefik.http.routers.frappe-insights-https.tls=true
      - traefik.http.routers.frappe-insights-https.service=frappe-frontend
      - traefik.http.services.frappe-frontend.loadbalancer.server.port=8080
      - traefik.http.services.frontend.loadbalancer.server.port=8080

  websocket:
    image: frappe-custom:v16
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://127.0.0.1:9000/socket.io/?EIO=4&transport=polling' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      frappe_network:
        aliases:
          - frappe-websocket

  queue-short:
    image: frappe-custom:v16
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - frappe_network

  queue-long:
    image: frappe-custom:v16
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - frappe_network

  scheduler:
    image: frappe-custom:v16
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -q schedule /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - frappe_network

  create-site:
    image: frappe-custom:v16
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/erp.ty-dev.site" ]; then
          echo "Site erp.ty-dev.site exists, ensuring all unified agency apps are installed...";
          for app in hrms crm telephony helpdesk raven wiki insights; do
            if ! bench --site erp.ty-dev.site list-apps | grep -q $$app; then
              echo "Installing $$app on erp.ty-dev.site...";
              bench --site erp.ty-dev.site install-app $$app;
            fi;
          done;
          bench --site erp.ty-dev.site set-config default_app erpnext;
          bench --site erp.ty-dev.site set-config cookie_domain ".ty-dev.site";
          echo "Running migrations for erp.ty-dev.site...";
          bench --site erp.ty-dev.site migrate;
        else
          echo "Creating site erp.ty-dev.site with full agency suite (ERPNext, HRMS, CRM, Helpdesk, Raven, Wiki, Insights)...";
          bench new-site erp.ty-dev.site \
            --mariadb-user-host-login-scope='%' \
            --admin-password=$${ADMIN_PASSWORD:-admin} \
            --db-root-username=root \
            --db-root-password=$${DB_PASSWORD:-admin} \
            --install-app erpnext \
            --install-app hrms \
            --install-app crm \
            --install-app telephony \
            --install-app helpdesk \
            --install-app raven \
            --install-app wiki \
            --install-app insights;
          bench --site erp.ty-dev.site set-config default_app erpnext;
          bench --site erp.ty-dev.site set-config cookie_domain ".ty-dev.site";
        fi;
        echo "Ensuring unified database configuration for crm, helpdesk, chat, wiki, and insights domains...";
        python3 -c "
import json, os, shutil
sites_dir = 'sites'
erp_cfg_path = os.path.join(sites_dir, 'erp.ty-dev.site', 'site_config.json')
if os.path.exists(erp_cfg_path):
    with open(erp_cfg_path) as f:
        cfg = json.load(f)
    cfg['cookie_domain'] = '.ty-dev.site'
    with open(erp_cfg_path, 'w') as f:
        json.dump(cfg, f, indent=1)
    subdomains = [
        ('crm.ty-dev.site', 'crm', 'crm'),
        ('helpdesk.ty-dev.site', 'helpdesk', 'helpdesk'),
        ('chat.ty-dev.site', 'raven', 'raven'),
        ('wiki.ty-dev.site', 'wiki-app', 'wiki'),
        ('insights.ty-dev.site', 'insights', 'insights')
    ]
    for sub, home, defapp in subdomains:
        sdir = os.path.join(sites_dir, sub)
        os.makedirs(sdir, exist_ok=True)
        scfg = dict(cfg)
        scfg['home_page'] = home
        scfg['default_app'] = defapp
        scfg['cookie_domain'] = '.ty-dev.site'
        with open(os.path.join(sdir, 'site_config.json'), 'w') as f:
            json.dump(scfg, f, indent=1)
        for fold in ['public/files', 'private/files']:
            target = os.path.join(sites_dir, 'erp.ty-dev.site', fold)
            link = os.path.join(sdir, fold)
            os.makedirs(target, exist_ok=True)
            if os.path.exists(link) and not os.path.islink(link):
                shutil.rmtree(link)
            if not os.path.exists(link):
                os.symlink(target, link)
    print('Unified multi-domain sites configuration verified.')
";
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - frappe_network

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - frappe_network

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frappe_network

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis-queue-data:/data
    networks:
      - frappe_network

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:

networks:
  frappe_network:
    driver: bridge
  coolify:
    external: true
